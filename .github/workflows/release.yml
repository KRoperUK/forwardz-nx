name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Please and publish NRO
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: .release-please-config.json

      # Release Please creates the tag and release in this same workflow run.
      # Checking out the tag ensures the asset matches the published release.
      - name: Checkout released tag
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Setup pnpm
        if: steps.release.outputs.release_created == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.release.outputs.release_created == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        if: steps.release.outputs.release_created == 'true'
        run: pnpm install --frozen-lockfile

      - name: Validate release source
        if: steps.release.outputs.release_created == 'true'
        run: |
          pnpm typecheck
          pnpm lint

      - name: Build Forwardz NRO
        if: steps.release.outputs.release_created == 'true'
        run: pnpm nro

      - name: Generate checksum
        if: steps.release.outputs.release_created == 'true'
        run: sha256sum forwardz.nro > forwardz.nro.sha256

      - name: Attach NRO to GitHub Release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          gh release upload "$TAG_NAME" \
            forwardz.nro \
            forwardz.nro.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
