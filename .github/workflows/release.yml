name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Please and publish NRO
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .release-please-config.json

      # Release Please creates the tag and release in this same workflow run.
      # Checking out the tag ensures the asset matches the published release.
      - name: Checkout released tag
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Setup pnpm
        if: steps.release.outputs.release_created == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Setup Node.js
        if: steps.release.outputs.release_created == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        if: steps.release.outputs.release_created == 'true'
        run: pnpm install --frozen-lockfile

      - name: Validate release source
        if: steps.release.outputs.release_created == 'true'
        run: |
          pnpm typecheck
          pnpm lint

      - name: Build Forwardz NRO
        if: steps.release.outputs.release_created == 'true'
        run: pnpm nro

      - name: Write build provenance
        if: steps.release.outputs.release_created == 'true'
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          cat > build-info.txt <<EOF
          tag: $TAG_NAME
          commit: $GITHUB_SHA
          repository: $GITHUB_REPOSITORY
          built: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          node: $(node --version)
          pnpm: $(pnpm --version)
          EOF
          sha256sum forwardz.nro > forwardz.nro.sha256
          sha256sum build-info.txt > build-info.txt.sha256

      - name: Attach NRO to GitHub Release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          gh release upload "$TAG_NAME" \
            forwardz.nro \
            forwardz.nro.sha256 \
            build-info.txt \
            build-info.txt.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
